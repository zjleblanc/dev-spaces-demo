# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-navigator/v26.11.0/src/ansible_navigator/data/ansible-navigator.json
ansible-navigator:

  ansible:
    inventory:
      entries:
        - ./inventory/hosts.yml

  execution-environment:
    container-engine: podman

    environment-variables:
      set:
        # Path inside the EE, after the volume mount below.
        ANSIBLE_PRIVATE_KEY_FILE: /home/user/.ssh/id_rsa

    # AAP 2.7 supported execution environment
    image: quay.io/zleblanc/ee-default:ac1abd92

    pull:
      policy: missing

    # The key is copied to /projects/.ssh with mode 600. That directory is
    # outside the project, so mount it at the user home inside the EE.
    volume-mounts:
      - src: /projects/.ssh
        dest: /home/user/.ssh
        options: ro,Z

    # Use host network
    # container-options:
    #   - "--net=host"

  format: yaml

  logging:
    level: critical
    # append: False
    # file: /tmp/log.txt

  # Uncomment for ansible-playbook style output during a live demo
  # mode: stdout

  playbook-artifact:
    enable: false

  time-zone: local
