# yaml-language-server: $schema=https://raw.githubusercontent.com/ansible/ansible-navigator/v26.11.0/src/ansible_navigator/data/ansible-navigator.json
ansible-navigator:

  ansible:
    inventory:
      entries:
        - ./inventory/hosts.yml

  execution-environment:
    container-engine: podman

    # Pass custom environment variables into the EE
    # environment-variables:
    #   pass:
    #     - ONE
    #     - TWO
    #     - THREE
    #   set:
    #     KEY1: VALUE1
    #     KEY2: VALUE2
    #     KEY3: VALUE3

    # AAP 2.7 supported execution environment
    image: quay.io/zleblanc/ee-default:ac1abd92

    pull:
      policy: missing

    # Extra mountpoints
    # volume-mounts:
    #   - src: "/tmp"
    #     dest: "/test1"
    #     options: "Z"

    # Use host network
    # container-options:
    #   - "--net=host"

  format: yaml

  logging:
    level: critical
    # append: False
    # file: /tmp/log.txt

  # Uncomment for ansible-playbook style output during a live demo
  # mode: stdout

  playbook-artifact:
    enable: false

  time-zone: local
