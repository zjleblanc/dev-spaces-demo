# yaml-language-server: $schema=https://raw.githubusercontent.com/devfile/api/v2.3.0/schemas/latest/devfile.json
schemaVersion: 2.3.0
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: dev-spaces-demo
components:
  - name: dev-tools
    container:
      image: registry.redhat.io/ansible-automation-platform-27/ansible-devspaces-rhel9:latest
      cpuLimit: 4000m
      cpuRequest: 250m
      memoryRequest: 128Mi
      memoryLimit: 8Gi
      env:
        - name: HOME
          value: "/projects"
        - name: VSCODE_DEFAULT_WORKSPACE
          value: "/projects/dev-spaces-demo/.code-workspace"
        - name: "ADT_CONTAINER_ENGINE"
          value: "podman"
commands:
  - id: setup-ssh-for-navigator
    exec:
      component: dev-tools
      commandLine: "mkdir -p /projects/.ssh && cp -f /home/user/.ssh/* /projects/.ssh/ && chmod 700 /projects/.ssh && chmod 600 /projects/.ssh/id_rsa"
events:
  postStart:
    - setup-ssh-for-navigator
